<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Profile - Insure With Shan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111; --card: #1A1A1A; --border: #2A2A2A;
    --emerald: #2ECC71; --emerald-dark: #27AE60; --emerald-subtle: rgba(46,204,113,0.1);
    --white: #FAFAFA; --text-light: #BFBFBF; --text-muted: #888888;
    --danger: #E74C3C; --teal: #1ABC9C; --blue: #3498DB; --purple: #9B59B6; --orange: #E67E22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--white); min-height: 100vh; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .fade-up { animation: fadeUp 0.5s ease; }
  input, textarea { font-family: 'DM Sans', system-ui, sans-serif; }
  input:focus, textarea:focus { border-color: var(--emerald) !important; outline: none; }
  .input { width: 100%; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--white); font-size: 15px; }
  .label { color: var(--text-light); font-size: 13px; margin-bottom: 6px; display: block; font-weight: 500; letter-spacing: 0.02em; }
  .chip { padding: 10px 20px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; color: var(--text-light); cursor: pointer; font-size: 14px; transition: all 0.2s; user-select: none; font-family: 'DM Sans', system-ui, sans-serif; }
  .chip.active { border-color: var(--emerald); background: var(--emerald-subtle); color: var(--emerald); font-weight: 600; }
  .chip:hover { border-color: var(--emerald); }
  .btn-primary { padding: 14px 36px; background: var(--emerald); color: #111; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', system-ui, sans-serif; transition: all 0.2s; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { padding: 14px 24px; background: transparent; color: var(--text-light); border: 1px solid var(--border); border-radius: 10px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', system-ui, sans-serif; }
  .btn-secondary:hover { border-color: var(--text-light); }
  .progress-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
  .progress-bar.active { background: var(--emerald); }
  .card { background: var(--card); border-radius: 14px; padding: 28px 24px; border: 1px solid var(--border); }
  @media (max-width: 480px) {
    .chip { padding: 8px 14px; font-size: 13px; }
  }
</style>
</head>
<body>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjPDigXUpivPPoXbqm_kBYuuoKSAdaseRMJtwAfodWrGg8NrrGGrOWJFqk-fVh-hcuMA/exec";
  const ADVISER_PIN = "8080";
</script>

<div id="app"></div>

<script>
// ============================================
// STATE
// ============================================
let currentView = "client";
let authenticated = false;
let step = 0;
let submissions = [];
let selectedClient = null;
let generated = {};

const form = {
  name: "", phone: "", age: "", income: "",
  coverage: [], budget: "", marital: "",
  employment: "", smoker: "",
  medicalConditions: "", medicalDetails: "",
  hasInsurance: "", insuranceDetails: "",
  dependants: "",
};

const STEPS = ["About You", "Coverage Needs", "Your Situation", "Existing Coverage"];

// ============================================
// GOOGLE SHEETS API
// ============================================
async function saveToSheet(data) {
  if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") {
    console.warn("Google Script URL not configured. Saving locally only.");
    return;
  }
  try {
    var formData = new URLSearchParams();
    formData.append("payload", JSON.stringify(data));
    await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: formData });
  } catch (e) { console.error("Failed to save:", e); }
}

async function loadFromSheet() {
  if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") return [];
  try {
    var res = await fetch(GOOGLE_SCRIPT_URL);
    var data = await res.json();
    return data.map(function(row) {
      return {
        ...row,
        coverage: typeof row.coverage === "string" ? row.coverage.split(", ") : row.coverage || [],
        age: String(row.age),
        budget: String(row.budget),
      };
    });
  } catch (e) { console.error("Failed to load:", e); return []; }
}

// ============================================
// RENDER
// ============================================
function render() {
  var app = document.getElementById("app");
  if (currentView === "client") app.innerHTML = renderClient();
  else if (currentView === "password") app.innerHTML = renderPassword();
  else if (currentView === "adviser") app.innerHTML = renderAdviser();
  attachEvents();
}

// ============================================
// CLIENT FORM
// ============================================
function renderClient() {
  return `
    <button onclick="goAdviser()" style="position:fixed;bottom:20px;left:20px;z-index:100;padding:8px 16px;background:rgba(26,26,26,0.95);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;backdrop-filter:blur(10px)">
      Adviser View ${submissions.length > 0 ? '<span style="background:var(--emerald);color:#111;border-radius:10px;padding:1px 7px;margin-left:6px;font-size:11px;font-weight:700">' + submissions.length + '</span>' : ""}
    </button>
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="width:100%;max-width:580px" class="fade-up">
        <div style="text-align:center;margin-bottom:36px">
          <h2 style="font-size:clamp(22px,6vw,32px);font-weight:800;letter-spacing:0.15em;color:var(--emerald);margin-bottom:24px">INSURE WITH SHAN :)</h2>
          <div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:16px">
            <div style="width:10px;height:10px;background:var(--emerald);border-radius:3px;transform:rotate(45deg)"></div>
            <span style="color:var(--text-light);font-size:18px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600">Insurance Profile</span>
          </div>
          <h1 style="font-size:26px;font-weight:700;margin-bottom:6px">Let's Get You Covered</h1>
          <p style="color:var(--text-muted);font-size:14px">Takes about 90 seconds</p>
        </div>
        <div style="display:flex;gap:4px;margin-bottom:32px">
          ${STEPS.map(function(_, i) { return '<div class="progress-bar ' + (i <= step ? 'active' : '') + '"></div>'; }).join("")}
        </div>
        <div style="margin-bottom:24px">
          <span style="color:var(--emerald);font-size:12px;font-weight:600;letter-spacing:0.08em">STEP ${step + 1} OF ${STEPS.length}</span>
          <h2 style="font-size:20px;font-weight:600;margin-top:6px">${STEPS[step]}</h2>
        </div>
        <div class="card" style="margin-bottom:24px">${renderStep()}</div>
        <div style="display:flex;justify-content:space-between">
          ${step > 0 ? '<button class="btn-secondary" onclick="prevStep()">Back</button>' : '<div></div>'}
          ${step < STEPS.length - 1
            ? '<button class="btn-primary" onclick="nextStep()">Continue</button>'
            : '<button class="btn-primary" onclick="syncInputs();submitForm()" style="min-width:160px">Submit Profile</button>'
          }
        </div>
      </div>
    </div>`;
}

function renderStep() {
  if (step === 0) return `
    <div style="display:flex;flex-direction:column;gap:20px">
      <div><label class="label">Full Name</label><input class="input" id="f-name" value="${form.name}" placeholder="e.g. Tan Cheng Shan" oninput="form.name=this.value"></div>
      <div><label class="label">Phone</label><input class="input" id="f-phone" value="${form.phone}" placeholder="e.g. 87279022" oninput="form.phone=this.value"></div>
      <div><label class="label">Age</label><input class="input" id="f-age" type="number" value="${form.age}" placeholder="" min="18" max="80" oninput="form.age=this.value"></div>
    </div>`;
  if (step === 1) return `
    <div style="display:flex;flex-direction:column;gap:24px">
      <div>
        <label class="label">What type of coverage are you looking for? (Select all that apply)</label>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">
          <div class="chip ${form.coverage.includes('Term Life')?'active':''}" data-field="coverage" data-value="Term Life" onclick="toggleArr('coverage','Term Life')">Term Life</div>
          <div class="chip ${form.coverage.includes('Whole Life / Endowment')?'active':''}" data-field="coverage" data-value="Whole Life / Endowment" onclick="toggleArr('coverage','Whole Life / Endowment')">Whole Life / Endowment</div>
          <div class="chip ${form.coverage.includes('Critical Illness')?'active':''}" data-field="coverage" data-value="Critical Illness" onclick="toggleArr('coverage','Critical Illness')">Critical Illness</div>
          <div class="chip ${form.coverage.includes('Hospitalisation')?'active':''}" data-field="coverage" data-value="Hospitalisation" onclick="toggleArr('coverage','Hospitalisation')">Hospitalisation (IP)</div>
          <div class="chip ${form.coverage.includes('Disability Income')?'active':''}" data-field="coverage" data-value="Disability Income" onclick="toggleArr('coverage','Disability Income')">Disability Income</div>
          <div class="chip ${form.coverage.includes('Personal Accident')?'active':''}" data-field="coverage" data-value="Personal Accident" onclick="toggleArr('coverage','Personal Accident')">Personal Accident</div>
          <div class="chip ${form.coverage.includes('Not sure')?'active':''}" data-field="coverage" data-value="Not sure" onclick="toggleArr('coverage','Not sure')">Not sure — advise me</div>
        </div>
      </div>
      <div>
        <label class="label">Monthly Budget for Premiums (SGD)</label>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
          ${["50","100","200","300","500"].map(function(v) { return '<div class="chip ' + (form.budget===v?'active':'') + '" data-field="budget" data-value="' + v + '" onclick="setField(\'budget\',\'' + v + '\')">$' + v + '</div>'; }).join("")}
        </div>
      </div>
    </div>`;
  if (step === 2) return `
    <div style="display:flex;flex-direction:column;gap:24px">
      <div>
        <label class="label">Employment Status</label>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
          <div class="chip ${form.employment==='employed'?'active':''}" data-field="employment" data-value="employed" onclick="setField('employment','employed')">Employed</div>
          <div class="chip ${form.employment==='self-employed'?'active':''}" data-field="employment" data-value="self-employed" onclick="setField('employment','self-employed')">Self-employed</div>
          <div class="chip ${form.employment==='not-working'?'active':''}" data-field="employment" data-value="not-working" onclick="setField('employment','not-working')">Not working</div>
        </div>
      </div>
      <div>
        <label class="label">Annual Income (SGD)</label>
        <div style="display:flex;align-items:center;gap:0">
          <span style="padding:14px 12px;background:var(--border);border:1px solid var(--border);border-radius:10px 0 0 10px;color:var(--emerald);font-size:15px;font-weight:600">$</span>
          <input class="input" id="f-income" type="text" value="${form.income}" placeholder="e.g. 50000" oninput="formatIncome(this)" style="border-radius:0 10px 10px 0;border-left:none">
        </div>
      </div>
      <div>
        <label class="label">Do you smoke?</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          <div class="chip ${form.smoker==='yes'?'active':''}" data-field="smoker" data-value="yes" onclick="setField('smoker','yes')">Yes</div>
          <div class="chip ${form.smoker==='no'?'active':''}" data-field="smoker" data-value="no" onclick="setField('smoker','no')">No</div>
        </div>
      </div>
      <div>
        <label class="label">Any existing medical conditions?</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          <div class="chip ${form.medicalConditions==='yes'?'active':''}" data-field="medicalConditions" data-value="yes" onclick="setField('medicalConditions','yes');render()">Yes</div>
          <div class="chip ${form.medicalConditions==='no'?'active':''}" data-field="medicalConditions" data-value="no" onclick="setField('medicalConditions','no');render()">No</div>
        </div>
        ${form.medicalConditions==='yes' ? '<textarea class="input" id="f-medicalDetails" style="margin-top:12px;min-height:70px;resize:vertical" placeholder="Briefly describe (e.g. diabetes, high blood pressure...)" oninput="form.medicalDetails=this.value">' + form.medicalDetails + '</textarea>' : ""}
      </div>
    </div>`;
  if (step === 3) return `
    <div style="display:flex;flex-direction:column;gap:24px">
      <div>
        <label class="label">Do you have any existing insurance policies?</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          <div class="chip ${form.hasInsurance==='yes'?'active':''}" data-field="hasInsurance" data-value="yes" onclick="setField('hasInsurance','yes');render()">Yes</div>
          <div class="chip ${form.hasInsurance==='no'?'active':''}" data-field="hasInsurance" data-value="no" onclick="setField('hasInsurance','no');render()">No</div>
        </div>
        ${form.hasInsurance==='yes' ? '<textarea class="input" id="f-insuranceDetails" style="margin-top:12px;min-height:70px;resize:vertical" placeholder="Briefly describe (e.g. Term life with AIA, IP with Prudential...)" oninput="form.insuranceDetails=this.value">' + form.insuranceDetails + '</textarea>' : ""}
      </div>
      <div>
        <label class="label">Number of dependants</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          ${["0","1","2","3+"].map(function(v) { return '<div class="chip ' + (form.dependants===v?'active':'') + '" data-field="dependants" data-value="' + v + '" onclick="setField(\'dependants\',\'' + v + '\')">' + v + '</div>'; }).join("")}
        </div>
      </div>
    </div>`;
}

function renderThankYou() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
      <div style="text-align:center" class="fade-up">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--emerald-subtle);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;border:2px solid var(--emerald)">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 style="font-size:28px;margin-bottom:12px;font-weight:600">Thank You, ${form.name.split(" ")[0]}!</h2>
        <p style="color:var(--text-light);font-size:16px;max-width:400px;margin:0 auto;line-height:1.6">
          Your insurance profile has been submitted. Your adviser will review your information and prepare a personalised recommendation for you shortly.
        </p>
        <p style="color:var(--emerald);font-size:16px;margin-top:28px;font-style:italic">Yours sincerely, Shan</p>
      </div>
    </div>`;
}

// ============================================
// PASSWORD GATE
// ============================================
function renderPassword() {
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="width:100%;max-width:380px;text-align:center" class="fade-up">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--emerald-subtle);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;border:2px solid var(--border)">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2 style="font-size:22px;font-weight:700;margin-bottom:6px">Adviser Access</h2>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:28px">Enter your PIN to continue</p>
        <div id="pin-wrapper">
          <input type="password" id="pin-input" class="input" placeholder="Enter PIN" style="text-align:center;font-size:18px;letter-spacing:0.3em" autofocus>
        </div>
        <div id="pin-error" style="color:var(--danger);font-size:13px;margin-top:12px;font-weight:500;display:none">Incorrect PIN. Try again.</div>
        <button class="btn-primary" onclick="checkPin()" style="width:100%;margin-top:20px">Unlock</button>
        <button onclick="currentView='client';render()" style="background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;margin-top:16px">Back to Client View</button>
      </div>
    </div>`;
}

// ============================================
// ADVISER DASHBOARD
// ============================================
function renderAdviser() {
  if (selectedClient) return renderClientDetail();
  return `
    <div style="padding:32px 24px">
      <div style="max-width:800px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:12px">
          <div>
            <h1 style="font-size:26px;font-weight:700;margin-bottom:4px">Insurance Dashboard</h1>
            <p style="color:var(--text-muted);font-size:14px">${submissions.length} prospect${submissions.length!==1?"s":""} submitted</p>
          </div>
          <button class="btn-secondary" onclick="currentView='client';render()" style="font-size:13px;padding:10px 20px">Client View</button>
        </div>
        ${submissions.length === 0 ? `
          <div class="card" style="padding:60px 32px;text-align:center">
            <div style="width:56px;height:56px;border-radius:50%;background:var(--emerald-subtle);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </div>
            <h3 style="font-size:18px;margin-bottom:8px">No submissions yet</h3>
            <p style="color:var(--text-muted);font-size:14px">Share your URL with clients to start receiving profiles.</p>
          </div>
        ` : `
          <div style="display:flex;flex-direction:column;gap:12px">
            ${submissions.map(function(sub, i) {
              var isGen = generated[sub.phone];
              return '<div onclick="selectClient(' + i + ')" style="background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px 24px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">' +
                '<div>' +
                  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">' +
                    '<h3 style="font-size:16px;font-weight:600">' + sub.name + '</h3>' +
                    (isGen ? '<span style="padding:2px 10px;border-radius:4px;background:var(--emerald-subtle);color:var(--emerald);font-size:11px;font-weight:600">COPIED</span>' : "") +
                  '</div>' +
                  '<p style="color:var(--text-muted);font-size:13px">Age ' + sub.age + ' · $' + sub.budget + '/mo · ' + (Array.isArray(sub.coverage) ? sub.coverage.join(", ") : sub.coverage) + '</p>' +
                '</div>' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>' +
              '</div>';
            }).join("")}
          </div>
        `}
      </div>
    </div>`;
}

function renderClientDetail() {
  var c = selectedClient;
  return `
    <div style="padding:32px 24px">
      <div style="max-width:800px;margin:0 auto" class="fade-up">
        <button onclick="selectedClient=null;render()" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;margin-bottom:24px;padding:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> All Prospects
        </button>
        <h1 style="font-size:26px;font-weight:700;margin-bottom:6px">${c.name}</h1>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:28px">${c.phone}</p>

        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px">
          ${[
            {l:"AGE",v:c.age},
            {l:"BUDGET",v:"$" + c.budget + "/mo"},
            {l:"EMPLOYMENT",v:c.employment || "—"},
            {l:"INCOME",v:c.income ? "$" + parseInt(c.income).toLocaleString() : "—"},
            {l:"DEPENDANTS",v:c.dependants || "0"},
            {l:"SMOKER",v:c.smoker === "no" ? "No" : "Yes"},
          ].map(function(item) { return '<div style="background:var(--card);border-radius:10px;border:1px solid var(--border);padding:16px 18px"><div style="color:var(--text-muted);font-size:10px;letter-spacing:0.12em;font-weight:600;margin-bottom:6px">' + item.l + '</div><div style="color:var(--emerald);font-size:18px;font-weight:700">' + item.v + '</div></div>'; }).join("")}
        </div>

        <div class="card" style="margin-bottom:20px">
          <h3 style="font-size:15px;font-weight:600;margin-bottom:12px">Coverage Requested</h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${(Array.isArray(c.coverage) ? c.coverage : [c.coverage]).map(function(item) { return '<span style="padding:6px 14px;border-radius:6px;background:var(--emerald-subtle);color:var(--emerald);font-size:13px;font-weight:600">' + item + '</span>'; }).join("")}
          </div>
        </div>

        ${c.medicalConditions === "yes" ? '<div class="card" style="margin-bottom:20px"><h3 style="font-size:15px;font-weight:600;margin-bottom:8px">Medical Conditions</h3><p style="color:var(--text-light);font-size:13px">' + (c.medicalDetails || "Yes (no details)") + '</p></div>' : ""}

        ${c.hasInsurance === "yes" ? '<div class="card" style="margin-bottom:20px"><h3 style="font-size:15px;font-weight:600;margin-bottom:8px">Existing Insurance</h3><p style="color:var(--text-light);font-size:13px">' + (c.insuranceDetails || "Yes (no details)") + '</p></div>' : ""}

        <div style="text-align:center;margin-top:28px">
          <button class="btn-primary" onclick="copyPrompt()" style="padding:16px 48px;font-size:16px;font-weight:700;border-radius:12px">
            ${generated[c.phone] ? "Copy Prompt Again" : "Copy Prompt for Claude"}
          </button>
          ${generated[c.phone] ? `
            <div style="margin-top:20px" class="fade-up">
              <div style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--emerald-subtle);border-radius:10px;border:1px solid var(--emerald)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span style="color:var(--emerald);font-weight:600;font-size:14px">Copied to clipboard!</span>
              </div>
              <p style="color:var(--text-muted);font-size:13px;margin-top:10px">Paste into a new Claude chat to generate the insurance recommendation.</p>
            </div>` : ""}
        </div>
      </div>
    </div>`;
}

// ============================================
// EVENT HANDLERS
// ============================================
function attachEvents() {
  var pinInput = document.getElementById("pin-input");
  if (pinInput) pinInput.addEventListener("keydown", function(e) { if (e.key === "Enter") checkPin(); });
}

function setField(key, val) {
  form[key] = val;
  document.querySelectorAll('[data-field="' + key + '"]').forEach(function(el) {
    if (el.getAttribute('data-value') === val) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function formatIncome(el) {
  var raw = el.value.replace(/[^0-9]/g, '');
  form.income = raw;
  if (raw) {
    el.value = parseInt(raw).toLocaleString();
  }
}

function toggleArr(key, val) {
  if (val === "Not sure") { form[key] = form[key].includes(val) ? [] : [val]; }
  else {
    form[key] = form[key].filter(function(v) { return v !== "Not sure"; });
    var i = form[key].indexOf(val);
    if (i === -1) form[key].push(val); else form[key].splice(i, 1);
  }
  document.querySelectorAll('[data-field="' + key + '"]').forEach(function(el) {
    var v = el.getAttribute('data-value');
    if (form[key].includes(v)) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function syncInputs() {
  var el;
  el = document.getElementById('f-name'); if (el) form.name = el.value;
  el = document.getElementById('f-phone'); if (el) form.phone = el.value;
  el = document.getElementById('f-age'); if (el) form.age = el.value;
  el = document.getElementById('f-income'); if (el) form.income = el.value.replace(/[^0-9]/g, '');
  el = document.getElementById('f-medicalDetails'); if (el) form.medicalDetails = el.value;
  el = document.getElementById('f-insuranceDetails'); if (el) form.insuranceDetails = el.value;
}

function canNext() {
  syncInputs();
  if (step === 0) return form.name && form.phone && form.age && parseInt(form.age) > 0;
  if (step === 1) return form.coverage.length > 0 && form.budget;
  if (step === 2) return form.employment && form.income && form.smoker && form.medicalConditions;
  if (step === 3) return form.hasInsurance && form.dependants;
  return true;
}

function nextStep() { syncInputs(); if (canNext()) { step++; render(); } else { alert("Please fill in all fields before continuing."); } }
function prevStep() { syncInputs(); step--; render(); }

async function submitForm() {
  var data = Object.assign({}, form, { submittedAt: new Date().toISOString() });
  submissions.push(data);
  await saveToSheet(data);
  renderThankYou();
}

function goAdviser() { currentView = authenticated ? "adviser" : "password"; render(); }

function checkPin() {
  var val = document.getElementById("pin-input").value;
  if (val === ADVISER_PIN) {
    authenticated = true;
    currentView = "adviser";
    loadFromSheet().then(function(data) { if (data.length) submissions = data; render(); });
    render();
  } else {
    var wrapper = document.getElementById("pin-wrapper");
    var err = document.getElementById("pin-error");
    wrapper.style.animation = "shake 0.4s ease";
    err.style.display = "block";
    setTimeout(function() { wrapper.style.animation = ""; }, 500);
    setTimeout(function() { err.style.display = "none"; }, 2000);
  }
}

function selectClient(i) {
  selectedClient = submissions[i];
  render();
}

function copyPrompt() {
  var c = selectedClient;
  var prompt = "Please help me prepare an insurance recommendation for my client with the following details:\n\n" +
    "CLIENT PROFILE\n" +
    "- Name: " + c.name + "\n" +
    "- Age: " + c.age + "\n" +
    "- Annual Income: $" + (c.income || "Not provided") + "\n" +
    "- Phone: " + c.phone + "\n" +
    "- Marital Status: " + c.marital + "\n" +
    "- Employment: " + c.employment + "\n" +
    "- Smoker: " + c.smoker + "\n" +
    "- Dependants: " + c.dependants + "\n" +
    "- Monthly Budget: $" + c.budget + "\n" +
    "- Medical Conditions: " + (c.medicalConditions === "yes" ? c.medicalDetails || "Yes" : "No") + "\n" +
    "- Existing Insurance: " + (c.hasInsurance === "yes" ? c.insuranceDetails || "Yes" : "No") + "\n\n" +
    "COVERAGE REQUESTED\n" +
    (Array.isArray(c.coverage) ? c.coverage.join(", ") : c.coverage) + "\n\n" +
    "Please recommend suitable insurance products and coverage amounts based on this profile.";

  navigator.clipboard.writeText(prompt).then(function() {
    generated[c.phone] = true;
    render();
  }).catch(function() {
    var ta = document.createElement("textarea");
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    generated[c.phone] = true;
    render();
  });
}

// ============================================
// INIT
// ============================================
render();
</script>
</body>
</html>
